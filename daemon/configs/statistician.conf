# 统计员配置
# 📈 负责 Growth 增长

workspace = /app/workspace
log_level = info
log_file = /app/logs/statistician.log

heartbeat_interval = 60
heartbeat_prompt = 统计数据增长

max_retries = 3
retry_delay_ms = 1000

# 统计任务
cron.growth = 0 0 * * *|每日增长
cron.report = 0 8 * * *|报表生成

agent.statistician.enabled = true
agent.statistician.type = statistician
