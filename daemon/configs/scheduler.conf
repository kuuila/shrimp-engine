# 时间官配置
# ⏰ 负责运营调度

workspace = /app/workspace
log_level = info
log_file = /app/logs/scheduler.log

heartbeat_interval = 60
heartbeat_prompt = 检查调度任务

max_retries = 3
retry_delay_ms = 1000

# 调度任务
cron.schedule = 0 0 * * *|更新排期
cron.remind = 0 */30 * * *|提醒检查

agent.scheduler.enabled = true
agent.scheduler.type = scheduler
