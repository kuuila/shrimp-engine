# 情报员配置
# 👁️ 负责全网热点监控

workspace = /app/workspace
log_level = info
log_file = /app/logs/scout.log

heartbeat_interval = 30
heartbeat_prompt = 搜集最新情报

max_retries = 3
retry_delay_ms = 1000

# 情报任务 - 每2小时
cron.scout = 0 */2 * * *|情报搜集任务
cron.news = 0 0,6,12,18 * * *|新闻汇总

agent.scout.enabled = true
agent.scout.type = scout
agent.scout.targets = twitter,reddit,github,hackernews
