# 数据官配置
# 📊 负责数据分析

workspace = /app/workspace
log_level = info
log_file = /app/logs/analyst.log

heartbeat_interval = 60
heartbeat_prompt = 分析数据趋势

max_retries = 3
retry_delay_ms = 1000

# 分析任务
cron.analytics = 0 */4 * * *|数据汇总
cron.trend = 0 0,12 * * *|趋势分析

agent.analyst.enabled = true
agent.analyst.type = analyst
