# 美术官配置
# 🎨 负责视觉设计

workspace = /app/workspace
log_level = info
log_file = /app/logs/artist.log

heartbeat_interval = 60
heartbeat_prompt = 检查设计任务

max_retries = 3
retry_delay_ms = 1000

