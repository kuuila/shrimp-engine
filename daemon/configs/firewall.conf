# 防火墙配置
# 🛡️ 负责舆情监控

workspace = /app/workspace
log_level = warn
log_file = /app/logs/firewall.log

heartbeat_interval = 15
heartbeat_prompt = 监控舆情动态

max_retries = 3
retry_delay_ms = 1000

# 监控任务
cron.monitor = 0 */5 * * *|负面监控
cron.alert = 0 */1 * * *|告警检查

agent.firewall.enabled = true
agent.firewall.type = firewall
agent.firewall.alert_threshold = high
