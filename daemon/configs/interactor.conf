# 互动员配置
# 💬 负责关系维护

workspace = /app/workspace
log_level = info
log_file = /app/logs/interactor.log

heartbeat_interval = 15
heartbeat_prompt = 检查互动消息

max_retries = 3
retry_delay_ms = 1000

# 互动任务
cron.dm = 0 */1 * * *|私信回复
cron.mention = 0 */30 * * *|提及回复

agent.interactor.enabled = true
agent.interactor.type = interactor
agent.interactor.tone = 俏皮
