# 指挥官配置
# 🎯 统筹协调

workspace = /app/workspace
log_level = debug
log_file = /app/logs/commander.log

heartbeat_interval = 30
heartbeat_prompt = 统筹全局

max_retries = 3
retry_delay_ms = 1000

# 指挥任务
cron.orchestrate = 0 */1 * * *|协调任务
cron.report = 0 9,18 * * *|汇总汇报

agent.commander.enabled = true
agent.commander.type = commander
agent.commander.subordinates = scout,writer,artist,evangelist,interactor,analyst,firewall,scheduler,statistician
