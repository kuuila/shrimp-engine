# 宣教士配置
# 📢 负责公关传播

workspace = /app/workspace
log_level = info
log_file = /app/logs/evangelist.log

heartbeat_interval = 30
heartbeat_prompt = 检查传播任务

max_retries = 3
retry_delay_ms = 1000

# 传播任务
cron.post = 0 8,12,18,22 * * *|定时发布
cron.reply = 0 */1 * * *|回复互动

agent.evangelist.enabled = true
agent.evangelist.type = evangelist
agent.evangelist.platforms = discord,telegram,twitter
