# 撰稿人配置
# ✍️ 负责内容创作

workspace = /app/workspace
log_level = info
log_file = /app/logs/writer.log

heartbeat_interval = 60
heartbeat_prompt = 检查内容队列

max_retries = 3
retry_delay_ms = 1000

# 内容任务 - 8/12/20点
cron.content = 0 8,12,20 * * *|内容生成
cron.thread = 0 10,15,21 * * *|长文撰写

agent.writer.enabled = true
agent.writer.type = writer
agent.writer.style = krixa
